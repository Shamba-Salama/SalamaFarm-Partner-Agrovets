name: Build, Push to ECR, Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_NAME: salamafarm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.images.outputs.ecr_registry }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_image: ${{ steps.images.outputs.backend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image names
        id: images
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          echo "ecr_registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${APP_NAME}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${APP_NAME}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}:latest
            ${{ steps.images.outputs.frontend_image }}:sha-${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}:latest
            ${{ steps.images.outputs.backend_image }}:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        id: ssm
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -eu",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.ecr_registry }}",
              "cd /opt/salamafarm",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker image prune -f"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SalamaFarm containers from ECR" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}"

      - name: Check command status
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}'
