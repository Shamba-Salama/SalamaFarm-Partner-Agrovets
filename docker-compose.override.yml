# docker-compose.override.yml
# Local development overrides - automatically loaded by docker-compose
# Provides bind-mounts for hot-reload and exposes all service ports

version: '3.8'

services:
  db:
    ports:
      - "5432:5432"

  backend:
    environment:
      - DEBUG=True
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      # Bind mount source for hot-reload during development
      - ./backend:/app:ro
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    # Override build to use dev server instead of nginx for hot-reload
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      # Bind mount for hot-reload
      - .:/app:ro
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173