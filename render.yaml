# Render Blueprint — Django API only (not the nginx frontend).
# https://render.com/docs/blueprint-spec
#
# In the existing service dashboard, set Dockerfile Path to backend/Dockerfile
# and Docker Context to backend. The repo-root Dockerfile is the frontend
# (nginx) and is what currently serves "Welcome to nginx!".

databases:
  - name: salamafarm-db
    plan: basic-256mb

services:
  - type: web
    name: salamafarm-partner-agrovets
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salamafarm-db
          property: connectionString
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
