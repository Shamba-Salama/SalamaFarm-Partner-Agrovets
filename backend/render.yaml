services:
  - type: web
    name: salamafarm-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,api.salamafarm.com,*.onrender.com"
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/postgres
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8080,http://127.0.0.1:8080,https://your-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:8080,http://127.0.0.1:8080,https://your-frontend.vercel.app"
      - key: PAYSTACK_SECRET_KEY
        value: ""
      - key: PAYSTACK_PUBLIC_KEY
        value: ""
      - key: AFRICASTALKING_USERNAME
        value: "sandbox"
      - key: AFRICASTALKING_API_KEY
        value: ""
      - key: AFRICASTALKING_SENDER_ID
        value: ""
      - key: OTP_DEV_MODE
        value: "True"
